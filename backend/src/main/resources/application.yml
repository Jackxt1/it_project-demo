server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bkk-carglass-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bkk_carglass}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  sql:
    init:
      mode: always
      separator: "@@"

app:
  jwt:
    # Replace in production. Must be a Base64-encoded key of at least 256 bits for HS256.
    secret: ${JWT_SECRET:ZmFrZS1zZWNyZXQta2V5LWZvci1ia2stY2FyZ2xhc3MtcHJvamVjdC1jaGFuZ2UtbWUtaW4tcHJvZC0xMjM0NTY3ODkw}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  booking:
    # Comma-separated daily time slots shared by every service (capacity differs per service)
    time-slots: ${BOOKING_TIME_SLOTS:09:00,10:30,12:00,13:30,15:00,16:30}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  upload:
    # Used only when Cloudinary isn't configured (cloud-name blank) — saves
    # uploads to local disk and serves them back from this backend instead.
    local-dir: ${UPLOAD_LOCAL_DIR:uploads}
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:http://localhost:8080}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
  firebase:
    # Path to the Firebase service account JSON key file. Leave empty to disable
    # push notifications (logs a warning at startup instead of failing).
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
  payment:
    # Shop's PromptPay ID (phone number or tax ID) encoded into the payment
    # QR code. Leave empty to disable QR payment (shows a "not configured"
    # message instead of a broken QR).
    promptpay-id: ${PROMPTPAY_ID:0642200042}
  otp:
    length: ${OTP_LENGTH:6}
    ttl-seconds: ${OTP_TTL_SECONDS:300}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    max-per-hour: ${OTP_MAX_PER_HOUR:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    # ตัวส่งรหัส ตอนนี้มีแค่ log ถ้าตั้งค่าอื่นที่ยังไม่มีคลาสรองรับ แอปจะบูตไม่ขึ้น
    # ซึ่งดีกว่าบูตผ่านแล้วเงียบๆ ไม่ส่ง OTP ให้ใครเลย
    sender: ${OTP_SENDER:log}
    # ส่งรหัสกลับมาใน response ของ /otp/request เพื่อให้ทดสอบได้ตอน dev
    # ต้องตั้งเป็น false ก่อน deploy ไม่งั้นใครก็ล็อกอินเป็นใครก็ได้ถ้ารู้เบอร์
    expose-code: ${OTP_EXPOSE_CODE:true}
  cors:
    # Comma-separated list of allowed origins (Flutter Web admin, etc). Set
    # CORS_ALLOWED_ORIGINS to the real deployed domain(s) in production.
    # พอร์ต dev ตรงกับ .claude/launch.json: 3000 web_admin, 5050 technician_app,
    # 5090 mobile (5000 เป็นพอร์ตเดิมของ mobile เก็บไว้เผื่อรันแบบเก่า)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5000,http://localhost:8080,http://localhost:3000,http://localhost:5050,http://localhost:5090}